# Dependabot keeps the toolchain current: one grouped Go modules PR every Monday for the tools and
# the examples (the SDK itself requires nothing), grouped security fixes, one GitHub Actions PR a
# month, all waiting three days after a release. A maintainer merges every PR.
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/tools", "/examples"]
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    groups:
      go-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      go-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "05:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
